<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spotify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      text-align: center;
      padding-top: 50px;
      margin: 0;
      font-family: Roboto, sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      position: relative;
    }
    #actionButton {
      font-size: 20px;
      padding: 10px 20px;
      cursor: pointer;
      background: #1DB954;
      border: none;
      color: #fff;
      border-radius: 4px;
    }
    /* Omnibar styles */
    .omnibar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 400px;
      height: 48px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }
    .omnibar .icon-container {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #E8F5E9;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .omnibar .icon-container svg {
      width: 20px;
      height: 20px;
      fill: #388E3C;
    }
    .omnibar .url-text {
      flex: 1;
      margin: 0 10px;
      font-size: 14px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .omnibar .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .omnibar .action {
      font-size: 20px;
      cursor: pointer;
      position: relative;
    }
    .omnibar .tab-count {
      width: 24px;
      height: 24px;
      border: 1px solid #999;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>GO CLICK BUTTON</h1>
  <button id="actionButton">CLICK ME</button>

  <script>
    const btn = document.getElementById('actionButton');
    let spotifyInterval;

    function startSpotifyLoop() {
      attemptSpotifyOpen();
      spotifyInterval = setInterval(attemptSpotifyOpen, 500);
      console.log('🔁 Started Spotify retry loop every 1s');

      btn.textContent = 'Go Fullscreen';
      btn.removeEventListener('click', startSpotifyLoop);
      btn.addEventListener('click', enterFullscreen);
      btn.style.backgroundColor = '#4CAF50';
    }

    function enterFullscreen() {
      const el = document.documentElement;
      const fs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (fs) fs.call(el).catch(e => console.warn('Fullscreen failed:', e));
      clearInterval(spotifyInterval);
      console.log('✔️ Fullscreen entered; stopped Spotify loop');
      btn.textContent = '🎉 Fullscreen!';
      btn.disabled = true;
    }

    function attemptSpotifyOpen() {
      const spotifyUrl = 'pandora://test/test';
      window.location.href = spotifyUrl;
      console.log('📤 Tried same-tab navigation to', spotifyUrl);
    }

    btn.addEventListener('click', startSpotifyLoop);
  </script>

</body>
</html>
